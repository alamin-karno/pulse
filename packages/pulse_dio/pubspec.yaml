name: pulse_dio
description: >-
  Dio interceptor for the Pulse Developer Intelligence SDK.
  Automatically captures HTTP request/response metrics from package:dio
  and forwards them to the Pulse event pipeline.
version: 0.1.0
repository: https://github.com/alamin-karno/pulse
homepage: https://github.com/alamin-karno/pulse
issue_tracker: https://github.com/alamin-karno/pulse/issues

funding:
  - https://github.com/sponsors/alamin-karno

topics:
  - monitoring
  - networking
  - observability
  - dio
  - sdk

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  dio: ^5.4.0
  pulse_dev: ^0.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
