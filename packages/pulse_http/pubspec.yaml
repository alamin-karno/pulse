name: pulse_http
description: >-
  package:http client wrapper for the Pulse Developer Intelligence SDK.
  Automatically captures HTTP request/response metrics from package:http
  and forwards them to the Pulse event pipeline.
version: 0.1.0
repository: https://github.com/alamin-karno/pulse
homepage: https://github.com/alamin-karno/pulse
issue_tracker: https://github.com/alamin-karno/pulse/issues

funding:
  - https://github.com/sponsors/alamin-karno

topics:
  - monitoring
  - networking
  - observability
  - http
  - sdk

environment:
  sdk: ">=3.5.0 <4.0.0"

resolution: workspace

dependencies:
  http: ^1.2.0
  pulse_dev: ^0.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
