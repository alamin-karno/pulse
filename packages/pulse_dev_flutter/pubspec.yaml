name: pulse_dev_flutter
description: >-
  Flutter integration for the Pulse Developer Intelligence SDK — automatic
  error capture, breadcrumbs, performance tracking, and an in-app debug
  inspector overlay.
version: 0.1.0
repository: https://github.com/alamin-karno/pulse
homepage: https://github.com/alamin-karno/pulse
issue_tracker: https://github.com/alamin-karno/pulse/issues

funding:
  - https://github.com/sponsors/alamin-karno

topics:
  - monitoring
  - error-reporting
  - observability
  - analytics
  - flutter

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.9.0
  pulse_dev: ^0.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
