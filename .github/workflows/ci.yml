name: CI

# Git flow: feature/bugfix PRs target `dev`; release/hotfix PRs target `main`.
# - pull_request → validates every PR into `dev` or `main` before merge.
# - push → re-validates the integrated result after a merge lands on `dev`/`main`.
# Pushes to other branches don't run CI on their own (the PR run covers them),
# which avoids running every job twice per PR.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but let every post-merge run on dev/main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── pulse_dev: format ──────────────────────────────────────────────────
  format_core:
    name: Format (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        working-directory: packages/pulse_dev
        run: dart format --set-exit-if-changed .

  # ── pulse_dev: analyze ─────────────────────────────────────────────────
  analyze_core:
    name: Analyze (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_dev
        run: dart analyze --fatal-infos .

  # ── pulse_dev: test ────────────────────────────────────────────────────
  test_core:
    name: Test (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        working-directory: packages/pulse_dev
        run: dart test --reporter=expanded

  # ── pulse_dev_flutter: format ──────────────────────────────────────────
  format_flutter:
    name: Format (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        working-directory: packages/pulse_dev_flutter
        run: dart format --set-exit-if-changed .

  # ── pulse_dev_flutter: analyze ─────────────────────────────────────────
  analyze_flutter:
    name: Analyze (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_dev_flutter
        run: flutter analyze --fatal-infos

  # ── pulse_dev_flutter: test ────────────────────────────────────────────
  test_flutter:
    name: Test (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        working-directory: packages/pulse_dev_flutter
        run: flutter test --reporter=expanded

  # ── pulse_dio: analyze + test ──────────────────────────────────────────
  check_dio:
    name: Analyze & Test (pulse_dio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_dio
        run: dart analyze --fatal-infos .
      - name: Run tests
        working-directory: packages/pulse_dio
        run: dart test --reporter=expanded

  # ── pulse_http: analyze + test ─────────────────────────────────────────
  check_http:
    name: Analyze & Test (pulse_http)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_http
        run: dart analyze --fatal-infos .
      - name: Run tests
        working-directory: packages/pulse_http
        run: dart test --reporter=expanded

  # ── publish dry-run: all publishable packages ──────────────────────────
  publish_dry_run:
    name: Publish dry-run (all packages)
    runs-on: ubuntu-latest
    needs:
      - test_core
      - test_flutter
      - check_dio
      - check_http
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
      - name: Install dependencies
        run: flutter pub get
      - name: Discard tooling-generated changes
        # Newer Flutter releases auto-migrate tracked files during `pub get`
        # (e.g. adding analyzer excludes to analysis_options.yaml). pub's
        # publish validator warns on any modified tracked file, which fails
        # the run. Surface the drift as a warning, then publish from the
        # committed state. If this warns, commit the migrated file locally.
        run: |
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::warning::Tooling modified tracked files — commit the migrated versions:"
            git --no-pager diff
            git restore .
          fi
      - name: Dry-run — pulse_dev
        working-directory: packages/pulse_dev
        run: dart pub publish --dry-run
      - name: Dry-run — pulse_dev_flutter
        working-directory: packages/pulse_dev_flutter
        run: dart pub publish --dry-run
      - name: Dry-run — pulse_dio
        working-directory: packages/pulse_dio
        run: dart pub publish --dry-run
      - name: Dry-run — pulse_http
        working-directory: packages/pulse_http
        run: dart pub publish --dry-run
