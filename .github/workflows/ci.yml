name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── pulse_dev: format ──────────────────────────────────────────────────
  format_core:
    name: Format (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        working-directory: packages/pulse_dev
        run: dart format --set-exit-if-changed .

  # ── pulse_dev: analyze ─────────────────────────────────────────────────
  analyze_core:
    name: Analyze (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_dev
        run: dart analyze --fatal-infos .

  # ── pulse_dev: test ────────────────────────────────────────────────────
  test_core:
    name: Test (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        working-directory: packages/pulse_dev
        run: dart test --reporter=expanded

  # ── pulse_dev_flutter: format ──────────────────────────────────────────
  format_flutter:
    name: Format (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        working-directory: packages/pulse_dev_flutter
        run: dart format --set-exit-if-changed .

  # ── pulse_dev_flutter: analyze ─────────────────────────────────────────
  analyze_flutter:
    name: Analyze (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_dev_flutter
        run: flutter analyze --fatal-infos

  # ── pulse_dev_flutter: test ────────────────────────────────────────────
  test_flutter:
    name: Test (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        working-directory: packages/pulse_dev_flutter
        run: flutter test --reporter=expanded

  # ── pulse_dio: analyze + test ──────────────────────────────────────────
  check_dio:
    name: Analyze & Test (pulse_dio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_dio
        run: dart analyze --fatal-infos .
      - name: Run tests
        working-directory: packages/pulse_dio
        run: dart test --reporter=expanded

  # ── pulse_http: analyze + test ─────────────────────────────────────────
  check_http:
    name: Analyze & Test (pulse_http)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_http
        run: dart analyze --fatal-infos .
      - name: Run tests
        working-directory: packages/pulse_http
        run: dart test --reporter=expanded

  # ── publish dry-run: all publishable packages ──────────────────────────
  publish_dry_run:
    name: Publish dry-run (all packages)
    runs-on: ubuntu-latest
    needs:
      - test_core
      - test_flutter
      - check_dio
      - check_http
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Reset git state
        run: git restore .
      - name: Dry-run — pulse_dev
        working-directory: packages/pulse_dev
        run: dart pub publish --dry-run
      - name: Dry-run — pulse_dev_flutter
        working-directory: packages/pulse_dev_flutter
        run: dart pub publish --dry-run
      - name: Dry-run — pulse_dio
        working-directory: packages/pulse_dio
        run: dart pub publish --dry-run
      - name: Dry-run — pulse_http
        working-directory: packages/pulse_http
        run: dart pub publish --dry-run
