name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── pulse_dev: format ──────────────────────────────────────────────────
  format_core:
    name: Format (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: packages/pulse_dev
        run: flutter pub get
      - name: Check formatting
        working-directory: packages/pulse_dev
        run: dart format --set-exit-if-changed .

  # ── pulse_dev: analyze ─────────────────────────────────────────────────
  analyze_core:
    name: Analyze (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: packages/pulse_dev
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_dev
        run: dart analyze --fatal-infos .

  # ── pulse_dev: test ────────────────────────────────────────────────────
  test_core:
    name: Test (pulse_dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: packages/pulse_dev
        run: flutter pub get
      - name: Run tests
        working-directory: packages/pulse_dev
        run: dart test --reporter=expanded

  # ── pulse_dev_flutter: format ───────────────────────────────────────────────
  format_flutter:
    name: Format (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: packages/pulse_dev_flutter
        run: flutter pub get
      - name: Check formatting
        working-directory: packages/pulse_dev_flutter
        run: dart format --set-exit-if-changed .

  # ── pulse_dev_flutter: analyze ──────────────────────────────────────────────
  analyze_flutter:
    name: Analyze (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: packages/pulse_dev_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: packages/pulse_dev_flutter
        run: flutter analyze --fatal-infos

  # ── pulse_dev_flutter: test ─────────────────────────────────────────────────
  test_flutter:
    name: Test (pulse_dev_flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: packages/pulse_dev_flutter
        run: flutter pub get
      - name: Run tests
        working-directory: packages/pulse_dev_flutter
        run: flutter test --reporter=expanded
